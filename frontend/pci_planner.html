<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Planner - PCI / PRACH / TAC Planning</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
<link rel="stylesheet" href="/navigation.css">
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- ========================================== -->
    <!-- TOPBAR / NAVIGATION (Pour lier les modules)-->
    <!-- ========================================== -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 shrink-0 z-50">
        <div class="flex items-center gap-6">
            <!-- Logo / Retour -->
            <a href="index.html" class="flex items-center gap-2 text-white font-bold text-lg hover:text-cyan-400 transition">
                <div class="w-2.5 h-2.5 bg-cyan-500 rounded-full animate-pulse"></div>
                RF Planner
            </a>
            
            <!-- Menu des Modules -->
            <nav id="main-nav" class="nav-container"></nav>
        </div>
        
        <div class="flex items-center gap-3">
            <span class="text-xs text-slate-500">Projet: <span class="text-slate-300 font-medium">Chicoutimi 5G</span></span>
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-xs font-bold text-white">JM</div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- CONTENU PRINCIPAL DU MODULE 5              -->
    <!-- ========================================== -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Panneau de Contrôle (Gauche) -->
        <aside class="w-[450px] bg-slate-800 border-r border-slate-700 flex flex-col overflow-y-auto shrink-0">
            <div class="p-5 border-b border-slate-700">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="text-cyan-400">🧠</span> PCI / PRACH / TAC Planning
                </h2>
                <p class="text-xs text-slate-400 mt-1">Algorithme de coloration de graphe (Mod-3 & Mod-30)</p>
            </div>

            <div class="p-5 space-y-5 flex-1">
                <!-- Contraintes -->
                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-3">Contraintes d'optimisation</label>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 p-3 bg-slate-900/50 border border-slate-700 rounded-lg cursor-pointer hover:border-cyan-500/50 transition">
                            <input type="checkbox" checked class="w-4 h-4 accent-cyan-500 rounded bg-slate-700 border-slate-600">
                            <div>
                                <div class="text-sm font-medium text-white">Éviter les conflits Mod-3</div>
                                <div class="text-xs text-slate-400">Critique pour le PSS (Synchronisation)</div>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-900/50 border border-slate-700 rounded-lg cursor-pointer hover:border-cyan-500/50 transition">
                            <input type="checkbox" checked class="w-4 h-4 accent-cyan-500 rounded bg-slate-700 border-slate-600">
                            <div>
                                <div class="text-sm font-medium text-white">Éviter les conflits Mod-30</div>
                                <div class="text-xs text-slate-400">Critique pour le DMRS/PRACH (2-hop)</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Sélection Vendor -->
                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Constructeur (Vendor)</label>
                    <select id="pci-vendor" class="w-full bg-slate-900 border border-slate-600 rounded-md px-3 py-2 text-sm text-white focus:ring-2 focus:ring-cyan-500 outline-none">
                        <option value="Huawei">Huawei (MML)</option>
                        <option value="Ericsson">Ericsson (Moshell)</option>
                        <option value="Nokia">Nokia (CLI)</option>
                    </select>
                </div>

                <button onclick="runPCIPlanning()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg transition shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Lancer l'attribution auto
                </button>

                <!-- Statistiques -->
                <div class="grid grid-cols-3 gap-2 mt-4">
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-center">
                        <div class="text-xs text-slate-500">Sites</div>
                        <div class="text-lg font-bold text-white font-mono" id="stat-sites">0</div>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-center">
                        <div class="text-xs text-slate-500">PCI Uniques</div>
                        <div class="text-lg font-bold text-emerald-400 font-mono" id="stat-pcis">0</div>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-center">
                        <div class="text-xs text-slate-500">TACs</div>
                        <div class="text-lg font-bold text-amber-400 font-mono" id="stat-tacs">0</div>
                    </div>
                </div>

                <!-- Bloc de Code (Script Export) -->
                <div class="bg-black border border-slate-700 rounded-lg p-4 relative group flex-1 min-h-[200px]">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold text-emerald-400 uppercase">Script de Configuration</h3>
                        <button onclick="copyPCIScript()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copier
                        </button>
                    </div>
                    <pre id="pci-script-output" class="text-xs font-mono text-green-400 overflow-x-auto whitespace-pre-wrap break-all max-h-64">
# En attente de l'algorithme...
                    </pre>
                </div>
            </div>
        </aside>

        <!-- Carte (Droite) -->
        <main class="flex-1 relative bg-slate-950">
            <div id="map-pci" class="w-full h-full z-0"></div>
            
            <!-- Légende flottante -->
            <div class="absolute bottom-6 left-6 bg-slate-800/90 backdrop-blur-md p-3 rounded-lg border border-slate-700 shadow-xl z-[1000]">
                <h4 class="text-xs font-bold text-slate-300 uppercase mb-2">Légende PCI (Mod-3)</h4>
                <div class="space-y-1.5">
                    <div class="flex items-center gap-2 text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-cyan-500"></div> PCI % 3 = 0</div>
                    <div class="flex items-center gap-2 text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-amber-500"></div> PCI % 3 = 1</div>
                    <div class="flex items-center gap-2 text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-rose-500"></div> PCI % 3 = 2</div>
                </div>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPT JAVASCRIPT                          -->
    <!-- ========================================== -->
    <script>
        // Initialisation de la carte
        const mapPCI = L.map('map-pci').setView([48.4284, -71.0656], 13);
        // ✅ APRÈS (fonctionne sans clé API)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(mapPCI);

        let pciLayerGroup = L.layerGroup().addTo(mapPCI);

        // Fonction de couleur basée sur Mod-3
        function getMod3Color(pci) {
            const mod = pci % 3;
            if (mod === 0) return '#06b6d4'; // Cyan
            if (mod === 1) return '#f59e0b'; // Amber
            return '#f43f5e'; // Rose
        }

        async function runPCIPlanning() {
            const vendor = document.getElementById('pci-vendor').value;
            document.getElementById('pci-script-output').innerText = "# Algorithme de coloration en cours...";
            
            try {
                // Appel à votre backend FastAPI
                const response = await fetch('/api/v1/pci-planning', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vendor: vendor })
                });
                
                const data = await response.json();
                
                // Mise à jour des stats
                document.getElementById('stat-sites').innerText = data.stats.total_sites;
                document.getElementById('stat-pcis').innerText = data.stats.unique_pcis;
                document.getElementById('stat-tacs').innerText = data.stats.tacs_used;
                
                // Mise à jour du script
                document.getElementById('pci-script-output').innerText = data.script;

                // Mise à jour de la carte
                pciLayerGroup.clearLayers();
                
                data.sites.forEach(site => {
                    const color = getMod3Color(site.assigned_pci);
                    const marker = L.circleMarker([site.lat, site.lon], {
                        radius: 12,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(pciLayerGroup);
                    
                    marker.bindPopup(`
                        <div style="color: #0f172a; font-family: sans-serif; min-width: 150px;">
                            <b style="font-size:14px;">${site.site_id}</b><br>
                            <span style="color:#64748b; font-size:12px;">Cell ID: ${site.cell_id}</span><hr style="margin:4px 0; border-color:#e2e8f0;">
                            PCI: <span style="font-weight:bold; color: ${color}">${site.assigned_pci}</span> (Mod-3: ${site.assigned_pci % 3})<br>
                            PRACH Root: ${site.prach_root}<br>
                            TAC: ${site.tac}
                        </div>
                    `);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('pci-script-output').innerText = "# Erreur API. Vérifiez que le backend FastAPI tourne sur le port 8000.";
            }
        }

        function copyPCIScript() {
            const scriptText = document.getElementById('pci-script-output').innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
                const btn = document.querySelector('button[onclick="copyPCIScript()"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copié !`;
                setTimeout(() => btn.innerHTML = originalText, 2000);
            });
        }
    </script>
<script src="/navigation.js"></script>
</body>
</html>
