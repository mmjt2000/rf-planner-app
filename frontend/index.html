<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Planner - Link Budget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col">

    <!-- Topbar -->
    <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-cyan-500 rounded-full animate-pulse"></div>
            <h1 class="text-lg font-bold text-white">RF Planner <span class="text-slate-500 font-normal">/ Link Budget</span></h1>
<nav class="flex items-center gap-1 text-sm">
    <a href="/" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Link Budget</a>
    <a href="/pci_planner.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">PCI / PRACH</a>
    <a href="/neighbor.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Voisinage</a>
    <a href="/nominal-planner.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Nominal</a>
    <a href="/scenario-simulator.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Simulateur</a>
    <a href="/terrain-import.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Terrain</a>
</nav>

        </div>
        <button class="px-4 py-2 text-sm font-medium text-white bg-cyan-600 hover:bg-cyan-500 rounded-lg">
            Exporter PDF
        </button>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Panneau de Configuration -->
        <aside class="w-96 bg-slate-800 border-r border-slate-700 p-5 overflow-y-auto">
            <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-3">Paramètres Radio</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fréquence (MHz)</label>
                    <select id="freq" class="w-full bg-slate-900 border border-slate-600 rounded-md px-3 py-2 text-sm text-white">
                        <option value="700">700 MHz</option>
                        <option value="1800">1800 MHz</option>
                        <option value="3500" selected>3500 MHz (5G)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Hauteur Antenne (m): <span id="h-val" class="text-white font-mono">30</span></label>
                    <input type="range" id="height" min="10" max="60" value="30" class="w-full accent-cyan-500">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Perte Clutter (dB): <span id="c-val" class="text-white font-mono">15</span></label>
                    <input type="range" id="clutter" min="0" max="30" value="15" class="w-full accent-cyan-500">
                </div>
            </div>

            <!-- Résultat -->
            <div class="mt-6 bg-slate-900/50 border border-cyan-500/30 rounded-lg p-4">
                <h3 class="text-xs font-bold text-cyan-400 uppercase mb-3">Résultat</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs text-slate-500">MAPL</div>
                        <div class="text-xl font-bold text-white font-mono" id="mapl-res">-- dB</div>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500">Rayon</div>
                        <div class="text-xl font-bold text-emerald-400 font-mono" id="radius-res">-- km</div>
                    </div>
                    <div class="col-span-2 border-t border-slate-700 pt-3">
                        <div class="text-xs text-slate-500">Sites estimés</div>
                        <div class="text-2xl font-bold text-white font-mono" id="sites-res">--</div>
                    </div>
                </div>
            </div>

            <button onclick="calculateLB()" class="w-full mt-4 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg">
                🔄 Calculer
            </button>
        </aside>

        <!-- Carte -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
        </main>
    </div>

    <script>
        // Initialisation Leaflet
        const map = L.map('map').setView([48.4284, -71.0656], 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // Appel API
        async function calculateLB() {
            const freq = parseFloat(document.getElementById('freq').value);
            const height = parseFloat(document.getElementById('height').value);
            const clutter = parseFloat(document.getElementById('clutter').value);
            
            document.getElementById('mapl-res').innerHTML = '<span class="text-cyan-400">Calcul...</span>';
            
            try {
                const response = await fetch('/api/v1/link-budget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        center_lat: 48.4284,
                        center_lon: -71.0656,
                        frequency_mhz: freq,
                        antenna_height_m: height,
                        clutter_loss_db: clutter,
                        propagation_model: "cost231",
                        target_area_km2: 100.0
                    })
                });

                const data = await response.json();
                
                document.getElementById('mapl-res').innerHTML = `${data.mapl_db} dB`;
                document.getElementById('radius-res').innerHTML = `${data.radius_km} km`;
                document.getElementById('sites-res').innerHTML = `~ ${data.estimated_sites} sites`;

                // Afficher les hexagones
                L.geoJSON(data.hexagons_geojson, {
                    style: { color: '#06b6d4', fillColor: '#06b6d4', fillOpacity: 0.15, weight: 1.5 }
                }).addTo(map);

            } catch (error) {
                console.error(error);
                document.getElementById('mapl-res').innerHTML = '<span class="text-red-400">Erreur</span>';
            }
        }

        // Listeners
        document.getElementById('height').addEventListener('input', (e) => {
            document.getElementById('h-val').innerText = e.target.value;
        });
        document.getElementById('clutter').addEventListener('input', (e) => {
            document.getElementById('c-val').innerText = e.target.value;
        });
    </script>
</body>
</html>
