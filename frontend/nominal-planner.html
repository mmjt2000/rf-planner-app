<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Planner - Nominal Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- TOPBAR -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 shrink-0 z-50">
        <div class="flex items-center gap-6">
            <a href="index.html" class="flex items-center gap-2 text-white font-bold text-lg hover:text-cyan-400 transition">
                <div class="w-2.5 h-2.5 bg-cyan-500 rounded-full animate-pulse"></div>
                RF Planner
            </a>
            <nav class="hidden md:flex items-center gap-1 text-sm">
                <a href="index.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Link Budget</a>
                <a href="pci_planner.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">PCI / PRACH</a>
                <a href="nominal-planner.html" class="px-3 py-1.5 rounded-md bg-cyan-600/20 text-cyan-400 border border-cyan-500/30 font-medium">Nominal Plan</a>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs text-slate-500">Projet: <span class="text-slate-300 font-medium">Chicoutimi 5G</span></span>
        </div>
    </header>

    <!-- CONTENU -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Panneau Gauche -->
        <aside class="w-[450px] bg-slate-800 border-r border-slate-700 flex flex-col overflow-y-auto shrink-0">
            <div class="p-5 border-b border-slate-700">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="text-cyan-400">📐</span> Nominal Planning
                </h2>
                <p class="text-xs text-slate-400 mt-1">Paramètres initiaux par site selon le type de zone</p>
            </div>

            <div class="p-5 space-y-5 flex-1">
                <!-- Sélection Zone -->
                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Type de Zone</label>
                    <select id="zone-type" class="w-full bg-slate-900 border border-slate-600 rounded-md px-3 py-2 text-sm text-white focus:ring-2 focus:ring-cyan-500 outline-none">
                        <option value="Dense_Urban">Urbain Dense (Cœur de ville)</option>
                        <option value="Suburban" selected>Suburbain (Périphérie)</option>
                        <option value="Rural">Rural (Autoroute / Campagne)</option>
                    </select>
                </div>

                <button onclick="generateNominal()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg transition shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Générer le Plan Nominal
                </button>

                <!-- Tableau des résultats -->
                <div class="bg-slate-900/50 border border-slate-700 rounded-lg overflow-hidden">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-slate-800 text-slate-400 uppercase">
                            <tr>
                                <th class="px-3 py-2">Site</th>
                                <th class="px-3 py-2">Azim.</th>
                                <th class="px-3 py-2">Tilt (M/E)</th>
                                <th class="px-3 py-2">Haut.</th>
                            </tr>
                        </thead>
                        <tbody id="nominal-table-body" class="divide-y divide-slate-700 text-slate-300">
                            <tr><td colspan="4" class="px-3 py-4 text-center text-slate-500">En attente de génération...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Export CSV -->
                <div class="bg-black border border-slate-700 rounded-lg p-4 relative group flex-1 min-h-[150px]">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold text-emerald-400 uppercase">Export CSV (Nominal Plan)</h3>
                        <button onclick="copyCSV()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copier
                        </button>
                    </div>
                    <pre id="csv-output" class="text-xs font-mono text-green-400 overflow-x-auto whitespace-pre-wrap break-all max-h-48">
# En attente...
                    </pre>
                </div>
            </div>
        </aside>

        <!-- Carte Droite -->
        <main class="flex-1 relative bg-slate-950">
            <div id="map-nominal" class="w-full h-full z-0"></div>
        </main>
    </div>

    <script>
        const mapNominal = L.map('map-nominal').setView([48.4284, -71.0656], 13);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap contributors',
            maxZoom: 17
        }).addTo(mapNominal);

        let nominalLayerGroup = L.layerGroup().addTo(mapNominal);

        async function generateNominal() {
            const zone = document.getElementById('zone-type').value;
            document.getElementById('csv-output').innerText = "# Calcul en cours...";
            
            try {
                const response = await fetch('/api/v1/nominal-planning', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone_type: zone })
                });
                
                const data = await response.json();
                document.getElementById('csv-output').innerText = data.csv_export;

                // Mise à jour du tableau
                const tbody = document.getElementById('nominal-table-body');
                tbody.innerHTML = '';
                nominalLayerGroup.clearLayers();

                data.sites.forEach(site => {
                    // Ligne tableau
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/50 transition">
                            <td class="px-3 py-2 font-medium text-white">${site.site_id}</td>
                            <td class="px-3 py-2 font-mono text-cyan-400">${site.azimuth_deg}°</td>
                            <td class="px-3 py-2 font-mono">${site.mech_tilt_deg}° / ${site.elec_tilt_deg}°</td>
                            <td class="px-3 py-2 font-mono">${site.height_m}m</td>
                        </tr>
                    `;

                    // Marqueur sur la carte (avec icône d'antenne simulée par un cercle avec direction)
                    const marker = L.circleMarker([site.lat, site.lon], {
                        radius: 8,
                        fillColor: '#06b6d4',
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.8
                    }).addTo(nominalLayerGroup);
                    
                    marker.bindPopup(`
                        <div style="color: #0f172a; font-family: sans-serif; min-width: 160px;">
                            <b>${site.site_id}</b><br>
                            <span style="font-size:11px; color:#64748b;">${site.antenna_type}</span><hr style="margin:4px 0; border-color:#e2e8f0;">
                            Azimuth: <b>${site.azimuth_deg}°</b><br>
                            Tilt: ${site.mech_tilt_deg}° (M) / ${site.elec_tilt_deg}° (E)<br>
                            Hauteur: ${site.height_m}m | P: ${site.tx_power_dbm} dBm
                        </div>
                    `);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('csv-output').innerText = "# Erreur API. Vérifiez que le serveur tourne.";
            }
        }

        function copyCSV() {
            const text = document.getElementById('csv-output').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Plan nominal copié dans le presse-papier ! Prêt pour Excel.");
            });
        }
    </script>
</body>
</html>
