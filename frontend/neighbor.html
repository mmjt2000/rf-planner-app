<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Planner - Planification de Voisinage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/navigation.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col overflow-hidden">

    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 shrink-0 z-50">
        <div class="flex items-center gap-6">
            <a href="/" class="flex items-center gap-2 text-white font-bold text-lg hover:text-cyan-400 transition">
                <div class="w-2.5 h-2.5 bg-cyan-500 rounded-full animate-pulse"></div>
                RF Planner
            </a>
            <nav class="hidden md:flex items-center gap-1 text-sm"><a href="/" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Link Budget</a><a href="/pci_planner.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">PCI / PRACH</a><a href="/neighbor.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Voisinage</a><a href="/nominal-planner.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Nominal</a><a href="/scenario-simulator.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Simulateur</a><a href="/terrain-import.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition">Terrain</a></nav>
            
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs text-slate-500">Projet: <span class="text-slate-300 font-medium">Chicoutimi 5G</span></span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-[450px] bg-slate-800 border-r border-slate-700 flex flex-col overflow-y-auto shrink-0">
            <div class="p-5 border-b border-slate-700">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="text-cyan-400">📡</span> Planification de Voisinage
                </h2>
                <p class="text-xs text-slate-400 mt-1">Détection automatique et export multi-vendor</p>
            </div>

            <div class="p-5 space-y-5 flex-1">
                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Site Source</label>
                    <select id="source-site" class="w-full bg-slate-900 border border-slate-600 rounded-md px-3 py-2 text-sm text-white focus:ring-2 focus:ring-cyan-500 outline-none">
                        <option value="MTL_5G_001">MTL_5G_001 (PCI 10)</option>
                        <option value="MTL_5G_002" selected>MTL_5G_002 (PCI 11)</option>
                        <option value="MTL_5G_003">MTL_5G_003 (PCI 13)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Rayon de détection : <span id="radius-value">2000</span> m</label>
                    <input type="range" id="radius" min="500" max="5000" step="100" value="2000" class="w-full accent-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Constructeur (Vendor)</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setVendor('Huawei', this)" class="vendor-btn py-2 bg-cyan-600 text-white text-xs font-medium rounded-md border border-cyan-500">Huawei</button>
                        <button onclick="setVendor('Ericsson', this)" class="vendor-btn py-2 bg-slate-700 text-slate-300 text-xs font-medium rounded-md border border-slate-600 hover:bg-slate-600">Ericsson</button>
                        <button onclick="setVendor('Nokia', this)" class="vendor-btn py-2 bg-slate-700 text-slate-300 text-xs font-medium rounded-md border border-slate-600 hover:bg-slate-600">Nokia</button>
                        <button onclick="setVendor('Samsung', this)" class="vendor-btn py-2 bg-slate-700 text-slate-300 text-xs font-medium rounded-md border border-slate-600 hover:bg-slate-600">Samsung</button>
                    </div>
                </div>

                <button onclick="detectNeighbors()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg transition shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Détecter & Générer
                </button>

                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                    <h3 class="text-xs font-bold text-emerald-400 uppercase mb-3">Voisins Détectés <span id="neighbor-count" class="text-white">0</span></h3>
                    <div id="neighbor-list" class="space-y-2 text-sm text-slate-300">
                        <p class="text-slate-500 text-xs">Lancez la détection pour voir les résultats.</p>
                    </div>
                </div>

                <div class="bg-black border border-slate-700 rounded-lg p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold text-emerald-400 uppercase">Script Généré</h3>
                        <button onclick="copyScript()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copier
                        </button>
                    </div>
                    <pre id="script-output" class="text-xs font-mono text-green-400 overflow-x-auto whitespace-pre-wrap break-all max-h-48"># En attente de génération...</pre>
                </div>
            </div>
        </aside>

        <main class="flex-1 relative bg-slate-950">
            <div id="map-neighbor" class="w-full h-full z-0"></div>
        </main>
    </div>

    <script>
        let currentVendor = 'Huawei';
        const map = L.map('map-neighbor').setView([48.4284, -71.0656], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const sites = [
            { site_id: 'MTL_5G_001', lat: 48.4284, lon: -71.0656, pci: 10 },
            { site_id: 'MTL_5G_002', lat: 48.4350, lon: -71.0550, pci: 11 },
            { site_id: 'MTL_5G_003', lat: 48.4200, lon: -71.0750, pci: 13 }
        ];

        sites.forEach(s => {
            L.circleMarker([s.lat, s.lon], {
                radius: 8, fillColor: '#06b6d4', color: '#fff', weight: 2, fillOpacity: 0.8
            }).addTo(map).bindPopup(<b></b><br>PCI: );
        });

        document.getElementById('radius').addEventListener('input', (e) => {
            document.getElementById('radius-value').innerText = e.target.value;
        });

        function setVendor(v, btn) {
            currentVendor = v;
            document.querySelectorAll('.vendor-btn').forEach(b => {
                b.className = 'vendor-btn py-2 bg-slate-700 text-slate-300 text-xs font-medium rounded-md border border-slate-600 hover:bg-slate-600';
            });
            btn.className = 'vendor-btn py-2 bg-cyan-600 text-white text-xs font-medium rounded-md border border-cyan-500';
        }

        async function detectNeighbors() {
            const source = document.getElementById('source-site').value;
            const radius = document.getElementById('radius').value;

            try {
                const response = await fetch('/api/v1/neighbors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source_site_id: source, detection_radius_m: parseFloat(radius), vendor: currentVendor })
                });
                const data = await response.json();

                document.getElementById('neighbor-count').innerText = data.neighbors.length;
                document.getElementById('script-output').innerText = data.vendor_script;

                const list = document.getElementById('neighbor-list');
                list.innerHTML = '';
                data.neighbors.forEach(n => {
                    list.innerHTML += <div class="flex justify-between items-center bg-slate-800/50 rounded p-2"><span class="font-medium text-white"></span><span class="font-mono text-xs text-cyan-400">m | PCI </span></div>;
                });
            } catch (error) {
                console.error(error);
                document.getElementById('script-output').innerText = '# Erreur API: ' + error.message;
            }
        }

        function copyScript() {
            const text = document.getElementById('script-output').innerText;
            navigator.clipboard.writeText(text).then(() => alert('Script copié !'));
        }
    </script>
    <script src="/navigation.js"></script>
</body>
</html>
