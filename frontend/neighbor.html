<!-- Module 4 : Planification de Voisinage -->
<div class="flex h-screen bg-slate-900 text-slate-200">
    
    <!-- Panneau de Contrôle (Gauche) -->
    <aside class="w-[450px] bg-slate-800 border-r border-slate-700 flex flex-col overflow-y-auto shrink-0">
        <div class="p-5 border-b border-slate-700">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <span class="text-cyan-400">📡</span> Planification de Voisinage
            </h2>
            <p class="text-xs text-slate-400 mt-1">Détection automatique et export multi-vendor</p>
        </div>

        <div class="p-5 space-y-5 flex-1">
            <!-- Sélection du Site Source -->
            <div>
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Site Source</label>
                <select id="source-site" class="w-full bg-slate-900 border border-slate-600 rounded-md px-3 py-2 text-sm text-white focus:ring-2 focus:ring-cyan-500 outline-none">
                    <option value="MTL_5G_001">MTL_5G_001 (PCI 10)</option>
                    <option value="MTL_5G_002">MTL_5G_002 (PCI 11)</option>
                    <option value="MTL_5G_003">MTL_5G_003 (PCI 13)</option>
                </select>
            </div>

            <!-- Rayon de détection -->
            <div>
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">
                    Rayon de détection : <span id="radius-val" class="text-white font-mono">2000</span> m
                </label>
                <input type="range" id="radius-slider" min="500" max="5000" step="100" value="2000" class="w-full accent-cyan-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Sélection Vendor -->
            <div>
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Constructeur (Vendor)</label>
                <div class="grid grid-cols-4 gap-2">
                    <button class="vendor-btn active bg-cyan-600 text-white text-xs py-2 rounded border border-cyan-500" data-vendor="Huawei">Huawei</button>
                    <button class="vendor-btn bg-slate-700 text-slate-300 text-xs py-2 rounded border border-slate-600 hover:bg-slate-600" data-vendor="Ericsson">Ericsson</button>
                    <button class="vendor-btn bg-slate-700 text-slate-300 text-xs py-2 rounded border border-slate-600 hover:bg-slate-600" data-vendor="Nokia">Nokia</button>
                    <button class="vendor-btn bg-slate-700 text-slate-300 text-xs py-2 rounded border border-slate-600 hover:bg-slate-600" data-vendor="Samsung">Samsung</button>
                </div>
            </div>

            <button onclick="runNeighborDetection()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg transition shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Détecter & Générer
            </button>

            <!-- Liste des Voisins Détectés -->
            <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4 mt-4">
                <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex justify-between">
                    <span>Voisins Détectés</span>
                    <span id="neighbor-count" class="text-cyan-400 font-mono">0</span>
                </h3>
                <div id="neighbor-list" class="space-y-2 max-h-48 overflow-y-auto">
                    <div class="text-xs text-slate-500 text-center py-2">Lancez la détection pour voir les résultats.</div>
                </div>
            </div>

            <!-- Bloc de Code (Script Export) -->
            <div class="bg-black border border-slate-700 rounded-lg p-4 relative group">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-emerald-400 uppercase">Script Généré</h3>
                    <button onclick="copyScript()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copier
                    </button>
                </div>
                <pre id="script-output" class="text-xs font-mono text-green-400 overflow-x-auto whitespace-pre-wrap break-all max-h-48">
# En attente de génération...
                </pre>
            </div>
        </div>
    </aside>

    <!-- Carte (Droite) -->
    <main class="flex-1 relative bg-slate-950">
        <div id="map-neighbor" class="w-full h-full z-0"></div>
    </main>
</div>

<script>
    // Initialisation de la carte pour ce module
    const mapNeighbor = L.map('map-neighbor').setView([48.4284, -71.0656], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
    }).addTo(mapNeighbor);

    let currentVendor = "Huawei";
    let neighborLayerGroup = L.layerGroup().addTo(mapNeighbor);

    // Gestion des boutons Vendor
    document.querySelectorAll('.vendor-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.vendor-btn').forEach(b => {
                b.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-500');
                b.classList.add('bg-slate-700', 'text-slate-300', 'border-slate-600');
            });
            e.target.classList.remove('bg-slate-700', 'text-slate-300', 'border-slate-600');
            e.target.classList.add('bg-cyan-600', 'text-white', 'border-cyan-500');
            currentVendor = e.target.dataset.vendor;
        });
    });

    // Slider Radius
    document.getElementById('radius-slider').addEventListener('input', (e) => {
        document.getElementById('radius-val').innerText = e.target.value;
    });

    // Fonction principale
    async function runNeighborDetection() {
        const sourceSiteId = document.getElementById('source-site').value;
        const radius = document.getElementById('radius-slider').value;
        
        // UI Loading state
        document.getElementById('script-output').innerText = "# Calcul en cours...";
        
        try {
            const response = await fetch('http://localhost:8000/api/v1/neighbors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_site_id: sourceSiteId,
                    detection_radius_m: parseFloat(radius),
                    vendor: currentVendor
                })
            });
            
            const data = await response.json();
            
            // Mise à jour de la liste des voisins
            const listContainer = document.getElementById('neighbor-list');
            listContainer.innerHTML = '';
            document.getElementById('neighbor-count').innerText = data.neighbors.length;
            
            neighborLayerGroup.clearLayers();
            
            // Marqueur du site source
            const sourceMarker = L.marker([data.source_site.lat, data.source_site.lon]).addTo(neighborLayerGroup);
            sourceMarker.bindPopup(`<b>SOURCE:</b> ${data.source_site.site_id}<br>PCI: ${data.source_site.pci}`).openPopup();

            data.neighbors.forEach(n => {
                // Item dans la liste UI
                const conflictBadge = n.pci_conflict_mod3 
                    ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-900/50 text-red-300 border border-red-800">CONFLIT MOD-3</span>` 
                    : `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-900/50 text-emerald-300 border border-emerald-800">OK</span>`;
                
                listContainer.innerHTML += `
                    <div class="flex items-center justify-between p-2 bg-slate-800 rounded border border-slate-700">
                        <div>
                            <div class="text-sm font-medium text-white">${n.site_id}</div>
                            <div class="text-xs text-slate-400">Dist: ${n.distance_m}m | PCI: ${n.pci}</div>
                        </div>
                        ${conflictBadge}
                    </div>
                `;

                // Ligne sur la carte
                const neighborMarker = L.marker([n.lat, n.lon]).addTo(neighborLayerGroup); // Note: lat/lon should be fetched or stored
                // Pour la démo, on trace juste une ligne depuis la source
                // (Dans la vraie app, utilisez les coordonnées exactes du voisin)
            });

            // Mise à jour du script
            document.getElementById('script-output').innerText = data.vendor_script;

        } catch (error) {
            console.error(error);
            document.getElementById('script-output').innerText = "# Erreur lors de l'appel API.";
        }
    }

    function copyScript() {
        const scriptText = document.getElementById('script-output').innerText;
        navigator.clipboard.writeText(scriptText).then(() => {
            alert("Script copié dans le presse-papier !");
        });
    }
</script>
